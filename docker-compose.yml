services:
  api:
    build: .
    # `expose` (not `ports`): Traefik reaches the container through
    # dokploy-network. Publishing 8000 on the host would also serve the API
    # at http://<vps-ip>:8000 — bypassing TLS, with Firebase ID tokens in
    # cleartext.
    expose:
      - "8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - AGNES_API_KEY=${AGNES_API_KEY}
      - AGNES_BASE_URL=${AGNES_BASE_URL}
      - AGNES_MODEL=${AGNES_MODEL}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DEBUG=${DEBUG:-}
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  qdrant_data:

networks:
  dokploy-network:
    external: true
